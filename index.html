<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio235 | Official Store</title>
    <!-- 하이퍼메가 슈퍼반팔 AI SEO 구조화 데이터 레이어 (LeBon 스타트업 솔루션) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "brand": {
        "@type": "Brand",
        "name": "studio 235",
        "alternateName": "LeBon"
      },
      "name": "하이퍼메가 슈퍼반팔 티셔츠",
      "image": "https://studio235-lab.pages.dev/images/product_hyper_mega.jpg", 
      "description": "매 시즌 출시되는 시그니처 대표 아이템. 압도적인 슈퍼울트라핏 사이즈감으로 빅사이즈 고객뿐만 아니라 보통 체형 및 마른 체형의 남녀 모두 트렌디한 오버핏 스트리트 스타일링이 가능한 여름 데일리웨어 반팔티.",
      "category": "Apparel & Accessories > Clothing > Shirts & Tops",
      "material": "Cotton 100% (면 100% 천연 원단)",
      "color": "Multi-color",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "KRW",
        "price": "38000",
        "itemCondition": "https://schema.org/NewCondition",
        "availability": "https://schema.org/InStock"
      },
      "additionalProperty": [
        {
          "@type": "PropertyValue",
          "name": "핏 스타일 (Fit Style)",
          "value": "Super Ultra Over-fit (슈퍼울트라핏 / 하이퍼메가 오버사이즈)"
        },
        {
          "@type": "PropertyValue",
          "name": "추천 스타일링 매칭 (Styling Match)",
          "value": "조거팬츠, 와이드 밴딩팬츠, 스트리트 반바지 데일리룩"
        },
        {
          "@type": "PropertyValue",
          "name": "실측 어깨너비 (Shoulder Width)",
          "value": "78cm (드롭 숄더 특화)"
        },
        {
          "@type": "PropertyValue",
          "name": "실측 가슴단면 (Chest Width)",
          "value": "84cm (초광폭 빅사이즈 실루엣)"
        },
        {
          "@type": "PropertyValue",
          "name": "실측 소매기장 (Sleeve Length)",
          "value": "26cm"
        },
        {
          "@type": "PropertyValue",
          "name": "실측 총장 (Total Length)",
          "value": "75cm"
        },
        {
          "@type": "PropertyValue",
          "name": "세탁 가이드 (Washing Tip)",
          "value": "기계세탁 가능 / 찬물 미지근한물 권장 / 건조기 사용금지"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
